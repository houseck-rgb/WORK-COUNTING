<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#f6ece3">
<title>직원 근무 계산기</title>
<style>
:root{--ivory:#fffaf5;--cream:#f6ece3;--wine:#7b343c;--wine2:#9b5158;--gold:#c49a5a;--gold2:#e4c796;--ink:#5a302d;--line:#dfc6a5}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#f9e9df,#fffaf5 42%,#f3e2d5);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Apple SD Gothic Neo",sans-serif;color:var(--ink)}
.app{max-width:620px;margin:auto;padding:18px 12px 30px}
.shell{background:rgba(255,250,245,.93);border:1px solid var(--gold2);border-radius:28px;padding:18px 14px;box-shadow:0 10px 35px rgba(104,58,45,.10),inset 0 0 0 1px #fff}
.head{text-align:center}.brand{font-family:Georgia,serif;font-style:italic;font-size:38px;color:#9a633e}.sub{letter-spacing:5px;font:11px Georgia,serif;color:#9b6549}.ym{font:31px Georgia,serif;margin-top:7px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:18px 0 12px}
button{font:inherit;color:inherit}.tab,.nav,.day,.action{border:1px solid var(--line);background:linear-gradient(#fffaf6,#f5e7dd);box-shadow:inset 0 1px #fff,0 3px 8px rgba(99,58,43,.08)}
.tab{min-height:58px;border-radius:17px;padding:5px;font-weight:700}.tab.on{background:linear-gradient(145deg,#8d454c,#672b32);color:#fff;border-color:#b98861;box-shadow:inset 0 0 0 1px #d5af7a,0 4px 10px rgba(93,37,43,.2)}
.monthrow{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center}.nav{height:48px;border-radius:50%;font-size:27px}.monthname{text-align:center;border:1px solid var(--gold2);border-radius:22px;padding:10px;font:700 22px Georgia,serif;background:#fff8f2}
.summary{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:8px;margin:14px 0}.sum{border:1px solid var(--gold2);border-radius:20px;padding:12px 5px;text-align:center;background:#fff9f4}.sum b{display:block;font:700 27px Georgia,serif}.sum small{font-weight:700}.sum.total{background:linear-gradient(145deg,#fffaf3,#f4e1cf);box-shadow:inset 0 0 0 1px #fff}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week{font-size:12px;text-align:center;margin:10px 0 5px}.sun{color:#bd5c5c}.sat{color:#6868a4}
.day{min-height:65px;border-radius:14px;padding:5px 2px;text-align:center}.day .num{font:700 16px Georgia,serif}.day .state{font-size:10px;margin-top:7px;font-weight:700}.day.work{background:linear-gradient(145deg,#9c5258,#702d35);color:white;border-color:#b97962}.day.half{background:linear-gradient(145deg,#d7b071,#ad7b3e);color:white;border-color:#d9b77d}.blank{min-height:65px}
.legend{display:flex;justify-content:center;gap:9px;flex-wrap:wrap;margin:16px 0;font-size:12px}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 11px;background:#fff}.pill.w{background:var(--wine);color:#fff}.pill.h{background:var(--gold);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.action{min-height:48px;border-radius:16px;font-weight:700}.save{margin-top:10px;text-align:center;font-size:12px;color:#936d58}
.note{font-size:11px;text-align:center;color:#9b7868;margin-top:8px}
@media(max-width:380px){.day{min-height:58px}.day .state{font-size:9px}.tab{font-size:11px}.summary{gap:5px}.sum b{font-size:23px}}
</style>
</head>
<body>
<div class="app"><div class="shell">
 <header class="head"><div class="brand">Staff</div><div class="sub">ATTENDANCE</div><div class="ym" id="ym"></div></header>
 <div class="tabs" id="tabs"></div>
 <div class="monthrow"><button class="nav" id="prev">‹</button><div class="monthname" id="monthname"></div><button class="nav" id="next">›</button></div>
 <div class="summary"><div class="sum"><b id="full">0</b><small>정상근무</small></div><div class="sum"><b id="half">0</b><small>반근무</small></div><div class="sum total"><b id="total">0일</b><small>총 근무일수</small></div></div>
 <div class="week"><div class="sun">일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div class="sat">토</div></div>
 <div class="calendar" id="calendar"></div>
 <div class="legend"><span class="pill">휴무</span><span class="pill w">✓ 정상근무 1일</span><span class="pill h">½ 반근무 0.5일</span></div>
 <div class="actions"><button class="action" id="rename">✎ 직원 이름 변경</button><button class="action" id="clear">이 달 기록 지우기</button></div>
 <div class="save">✓ 입력 즉시 이 휴대폰에 자동 저장됩니다</div>
 <div class="note">날짜 터치: 휴무 → 정상근무 → 반근무 → 휴무</div>
</div></div>
<script>
const STORAGE="staffAttendanceLuxeV1";
const initialNames=["만휘","직원2","직원3","직원4","직원5"];
let state;
try{state=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}
if(!state||!Array.isArray(state.names)||!state.records) state={names:[...initialNames],records:{}};
if(!state.records["0|2026-9"]) state.records["0|2026-9"]={4:1,7:.5,8:1,9:1,11:1,12:1,13:1,14:.5,15:1,16:1,18:1,19:1,20:1,21:.5,22:1,23:1,25:1,28:.5,29:.5,30:1};
let y=2026,m=8,selected=0;
const $=s=>document.querySelector(s);
const key=()=>`${selected}|${y}-${m+1}`;
const data=()=>state.records[key()]||(state.records[key()]={});
function save(){localStorage.setItem(STORAGE,JSON.stringify(state))}
function tabs(){const box=$("#tabs");box.innerHTML="";state.names.forEach((n,i)=>{let b=document.createElement("button");b.className="tab"+(i===selected?" on":"");b.textContent=n;b.onclick=()=>{selected=i;render()};box.appendChild(b)})}
function render(){
 tabs(); $("#ym").textContent=`${y}. ${String(m+1).padStart(2,"0")}`; $("#monthname").textContent=`${y}년 ${m+1}월`;
 let f=0,h=0;Object.values(data()).forEach(v=>v===1?f++:v===.5?h++:0);
 $("#full").textContent=f;$("#half").textContent=h;let t=f+h*.5;$("#total").textContent=(Number.isInteger(t)?t:t.toFixed(1))+"일";
 const c=$("#calendar");c.innerHTML="";const first=new Date(Date.UTC(y,m,1)).getUTCDay(),days=new Date(Date.UTC(y,m+1,0)).getUTCDate();
 for(let i=0;i<first;i++){let z=document.createElement("div");z.className="blank";c.appendChild(z)}
 for(let d=1;d<=days;d++){let v=data()[d]||0,b=document.createElement("button");b.className="day"+(v===1?" work":v===.5?" half":"");b.innerHTML=`<div class="num">${d}</div><div class="state">${v===1?"✓ 출근":v===.5?"½ 반근무":"·"}</div>`;b.onclick=()=>{let x=data()[d]||0;if(x===0)data()[d]=1;else if(x===1)data()[d]=.5;else delete data()[d];save();render()};c.appendChild(b)}
}
$("#prev").onclick=()=>{if(--m<0){m=11;y--}render()};
$("#next").onclick=()=>{if(++m>11){m=0;y++}render()};
$("#rename").onclick=()=>{let n=prompt("직원 이름을 입력하세요",state.names[selected]);if(n&&n.trim()){state.names[selected]=n.trim().slice(0,12);save();render()}};
$("#clear").onclick=()=>{if(confirm(`${y}년 ${m+1}월 ${state.names[selected]} 기록을 모두 지울까요?`)){state.records[key()]={};save();render()}};
save();render();
</script>
</body></html>
