<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#5c2d35"><title>워크카운팅</title>
<link rel="manifest" href="./manifest.json"><link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<style>
:root{--ivory:#fffaf5;--cream:#f6ece3;--wine:#74343d;--gold:#c59a5d;--gold2:#e5c995;--ink:#53312f;--line:#dfc6a5}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#f7e9df,#fffaf5 45%,#f1dfd1);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif;color:var(--ink)}
.app{max-width:620px;margin:auto;padding:16px 12px 30px}.shell{background:rgba(255,250,245,.95);border:1px solid var(--gold2);border-radius:28px;padding:18px 14px;box-shadow:0 10px 34px #633a2b1a,inset 0 0 0 1px #fff}
.head{text-align:center}.brand{font:italic 34px Georgia,serif;color:#93603e}.sub{letter-spacing:4px;font:11px Georgia,serif;color:#9b6549}.ym{font:29px Georgia,serif;margin-top:7px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:16px 0 12px}button{font:inherit;color:inherit}
.tab,.nav,.day,.action,.install{border:1px solid var(--line);background:linear-gradient(#fffaf6,#f5e7dd);box-shadow:inset 0 1px #fff,0 3px 8px #633a2b14}
.tab{min-height:55px;border-radius:16px;padding:4px;font-weight:700}.tab.on{background:linear-gradient(145deg,#934b53,#672d35);color:#fff;border-color:#b98861}
.monthrow{display:grid;grid-template-columns:50px 1fr 50px;gap:9px;align-items:center}.nav{height:46px;border-radius:50%;font-size:25px}.monthname{text-align:center;border:1px solid var(--gold2);border-radius:20px;padding:10px;font:700 21px Georgia,serif;background:#fff8f2}
.summary{display:grid;grid-template-columns:1fr 1fr 1.2fr;gap:7px;margin:13px 0}.sum{border:1px solid var(--gold2);border-radius:19px;padding:11px 4px;text-align:center;background:#fff9f4}.sum b{display:block;font:700 25px Georgia,serif}.sum small{font-size:11px;font-weight:700}.sum.total{background:linear-gradient(145deg,#fffaf3,#f1ddc9)}
.week,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week{font-size:11px;text-align:center;margin:9px 0 5px}.day{min-height:62px;border-radius:13px;padding:5px 1px;text-align:center}.day .num{font:700 15px Georgia,serif}.day .state{font-size:9px;margin-top:7px;font-weight:700}.day.work{background:linear-gradient(145deg,#995159,#6d3038);color:#fff;border-color:#b97962}.day.half{background:linear-gradient(145deg,#d4ae70,#aa793f);color:#fff}.blank{min-height:62px}
.legend{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin:14px 0;font-size:11px}.pill{border:1px solid var(--line);border-radius:999px;padding:7px 9px;background:#fff}.pill.w{background:var(--wine);color:#fff}.pill.h{background:var(--gold);color:#fff}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:7px}.action,.install{min-height:47px;border-radius:15px;font-weight:700}.install{width:100%;margin-top:8px;background:linear-gradient(145deg,#704049,#4f292f);color:#fff;border-color:#c29a62}.save{text-align:center;margin-top:9px;font-size:11px;color:#8c6b58}.note{text-align:center;font-size:10px;color:#9b7868;margin-top:7px}
</style></head><body><div class="app"><div class="shell">
<header class="head"><div class="brand">Work Counting</div><div class="sub">STAFF ATTENDANCE</div><div class="ym" id="ym"></div></header>
<div class="tabs" id="tabs"></div>
<div class="monthrow"><button class="nav" id="prev">‹</button><div class="monthname" id="monthname"></div><button class="nav" id="next">›</button></div>
<div class="summary"><div class="sum"><b id="full">0</b><small>정상근무</small></div><div class="sum"><b id="half">0</b><small>반근무</small></div><div class="sum total"><b id="total">0일</b><small>총 근무일수</small></div></div>
<div class="week"><div>일</div><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div></div><div class="calendar" id="calendar"></div>
<div class="legend"><span class="pill">휴무</span><span class="pill w">✓ 정상 1일</span><span class="pill h">½ 반근무 0.5일</span></div>
<div class="actions"><button class="action" id="rename">✎ 직원 이름 변경</button><button class="action" id="clear">이 달 기록 지우기</button></div>
<button class="install" id="install" hidden>홈 화면에 워크카운팅 설치</button>
<div class="save">✓ 입력 즉시 이 휴대폰에 자동 저장</div><div class="note">날짜 터치: 휴무 → 정상 → 반근무 → 휴무</div>
</div></div>
<script>
const S="workCountingV2";let st;try{st=JSON.parse(localStorage.getItem(S))}catch(e){}
if(!st||!st.names||!st.records)st={names:["만휘","직원2","직원3","직원4","직원5"],records:{}};
if(!st.records["0|2026-9"])st.records["0|2026-9"]={4:1,7:.5,8:1,9:1,11:1,12:1,13:1,14:.5,15:1,16:1,18:1,19:1,20:1,21:.5,22:1,23:1,25:1,28:.5,29:.5,30:1};
let y=2026,m=8,sel=0;const $=s=>document.querySelector(s),key=()=>`${sel}|${y}-${m+1}`,dat=()=>st.records[key()]||(st.records[key()]={}),save=()=>localStorage.setItem(S,JSON.stringify(st));
function tabs(){let z=$("#tabs");z.innerHTML="";st.names.forEach((n,i)=>{let b=document.createElement("button");b.className="tab"+(i===sel?" on":"");b.textContent=n;b.onclick=()=>{sel=i;render()};z.appendChild(b)})}
function render(){tabs();$("#ym").textContent=`${y}. ${String(m+1).padStart(2,"0")}`;$("#monthname").textContent=`${y}년 ${m+1}월`;let f=0,h=0;Object.values(dat()).forEach(v=>v===1?f++:v===.5?h++:0);$("#full").textContent=f;$("#half").textContent=h;let t=f+h*.5;$("#total").textContent=(Number.isInteger(t)?t:t.toFixed(1))+"일";let c=$("#calendar");c.innerHTML="";let first=new Date(Date.UTC(y,m,1)).getUTCDay(),days=new Date(Date.UTC(y,m+1,0)).getUTCDate();for(let i=0;i<first;i++){let x=document.createElement("div");x.className="blank";c.appendChild(x)}for(let d=1;d<=days;d++){let v=dat()[d]||0,b=document.createElement("button");b.className="day"+(v===1?" work":v===.5?" half":"");b.innerHTML=`<div class="num">${d}</div><div class="state">${v===1?"✓ 출근":v===.5?"½ 반근무":"·"}</div>`;b.onclick=()=>{let x=dat()[d]||0;if(x===0)dat()[d]=1;else if(x===1)dat()[d]=.5;else delete dat()[d];save();render()};c.appendChild(b)}}
$("#prev").onclick=()=>{if(--m<0){m=11;y--}render()};$("#next").onclick=()=>{if(++m>11){m=0;y++}render()};
$("#rename").onclick=()=>{let n=prompt("직원 이름",st.names[sel]);if(n&&n.trim()){st.names[sel]=n.trim().slice(0,12);save();render()}};
$("#clear").onclick=()=>{if(confirm("이 달 기록을 모두 지울까요?")){st.records[key()]={};save();render()}};
let installPrompt=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installPrompt=e;$("#install").hidden=false});
$("#install").onclick=async()=>{if(installPrompt){installPrompt.prompt();await installPrompt.userChoice;installPrompt=null;$("#install").hidden=true}};
if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js");
save();render();
</script></body></html>
